# fly.toml app configuration file generated for lumina-media on 2026-09-19T11:10:34+05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lumina-media'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NEXT_PUBLIC_APP_NAME = 'Lumina'
  NODE_ENV = 'production'
  PORT = '3000'

# Upload'lar uchun volume: /data ga ulanadi; app /app/public/uploads
# symlink orqali /data/uploads'ga yozadi (lost+found Next.js'ga ko'rinmaydi)
[[mounts]]
  source = 'lumina_uploads'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    protocol = 'http'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
